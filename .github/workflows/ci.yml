name: CI

on:
  push:
    branches: [main, master, jarvis-development]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REF: bee23322f1baa3d2dd16b8339bed6aff4a8eb663

# A newer push to the same branch replaces a build that is still running.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Gradle wrapper JAR checksum
        run: printf '%s  %s\\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Cache sherpa-onnx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/libs/*.aar
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}

      - name: Restore on-device model runtimes
        id: llama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: llama-server-three-abis-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      - name: Build on-device model runtimes
        id: llama-build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-android.sh

      - name: Cache completed native builds
        if: steps.llama-build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      # The APK is built and uploaded first, so a failing test or lint rule never hides an installable build.
      # The tests and lint still run below and still turn the workflow red when they fail.
      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          python3 scripts/check-apk-abis.py debug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Python trading engine tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: PYTHONPATH=trading-engine python -m unittest discover -s trading-engine/tests -v

      - name: Validate agent catalog safety
        run: python3 agents/validate_catalog.py

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: screenshots
          path: app/build/screenshots/
          if-no-files-found: ignore
