
name: CI

on:
  push:
    branches: [main, master, jarvis-development, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLAMA_CPP_REF: bee23322f1baa3d2dd16b8339bed6aff4a8eb663

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Gradle wrapper JAR checksum
        run: printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK, CMake and build-tools
        run: |
          sdkmanager --install "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Cache sherpa-onnx
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/libs/*.aar
          key: sherpa-onnx-${{ hashFiles('app/build.gradle.kts') }}

      - name: Restore on-device model runtimes
        id: llama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: llama-server-three-abis-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      - name: Build on-device model runtimes
        id: llama-build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-android.sh

      - name: Cache completed native builds
        if: steps.llama-build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Restore stable debug signing key
        if: github.event_name != 'pull_request'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-keystore-v1-${{ runner.os }}

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug
          python3 scripts/check-apk-abis.py debug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jarvis-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run Python tests
        run: PYTHONPATH=trading-engine python -m unittest discover -s trading-engine/tests -v

      - name: Scan tracked files for leaked credentials
        run: python3 scripts/scan_secrets.py

      - name: Test the secret scanner
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Validate agent catalog safety
        run: python3 agents/validate_catalog.py

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Upload test and lint reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            app/build/test-results/
          if-no-files-found: ignore
