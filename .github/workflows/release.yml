
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing semantic-version tag on master (for example v1.0.0)"
        required: true
        type: string
      confirm_publish:
        description: "I have reviewed the commit and approve publishing this release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  LLAMA_CPP_REF: bee23322f1baa3d2dd16b8339bed6aff4a8eb663

jobs:
  build:
    if: inputs.confirm_publish == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout selected tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify Gradle wrapper JAR checksum
        run: printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict

      - name: Validate release tag and source branch
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/master" || {
            echo "Run this release workflow from master, not from a feature branch."
            exit 1
          }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use vMAJOR.MINOR.PATCH format."
            exit 1
          }
          git fetch origin master --no-tags
          TAG_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/master || {
            echo "Refusing to publish code that is not reachable from master."
            exit 1
          }
          test "$TAG_COMMIT" = "$(git rev-parse HEAD)"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install pinned Android NDK, CMake and build-tools
        run: |
          sdkmanager --install "platforms;android-35" "ndk;27.2.12479018" "cmake;3.22.1" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Restore on-device model runtimes
        id: llama-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: llama-server-three-abis-${{ env.LLAMA_CPP_REF }}-${{ hashFiles('scripts/build-llama-android.sh') }}

      - name: Build on-device model runtimes
        id: llama-build
        if: steps.llama-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-llama-android.sh

      - name: Cache completed native builds
        if: steps.llama-build.outcome == 'success'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: app/src/main/jniLibs/*/libllama_server.so
          key: ${{ steps.llama-cache.outputs.cache-primary-key }}

      - name: Run tests and lint
        run: |
          ./gradlew testDebugUnitTest lintDebug
          PYTHONPATH=trading-engine python3 -m unittest discover -s trading-engine/tests -v
          python3 agents/validate_catalog.py
          python3 scripts/scan_secrets.py
          python3 -m unittest discover -s scripts/tests -v

      - name: Build unsigned release APKs
        run: |
          ./gradlew assembleRelease
          python3 scripts/check-apk-abis.py release

      - name: Require configured release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "A release signing key is required. Refusing to publish unsigned APKs."
            exit 1
          }

      - name: Sign and verify release APKs outside Gradle
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/release.jks"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          mkdir -p release-assets

          for abi in arm64-v8a armeabi-v7a x86_64; do
            unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "app-${abi}-release*.apk" -print -quit)"
            test -n "$unsigned" || { echo "Missing unsigned APK for $abi"; exit 1; }
            "$ZIPALIGN" -c -v 4 "$unsigned"
            signed="release-assets/Jarvis-${RELEASE_TAG}-${abi}.apk"
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$JARVIS_KEY_ALIAS" \
              --ks-pass env:JARVIS_KEYSTORE_PASSWORD --key-pass env:JARVIS_KEY_PASSWORD \
              --out "$signed" "$unsigned"
            "$APKSIGNER" verify --verbose --print-certs "$signed"
          done

          unsigned="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "app-universal-release*.apk" -print -quit)"
          test -n "$unsigned" || { echo "Missing universal APK"; exit 1; }
          "$ZIPALIGN" -c -v 4 "$unsigned"
          signed="release-assets/Jarvis-${RELEASE_TAG}.apk"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$JARVIS_KEY_ALIAS" \
            --ks-pass env:JARVIS_KEYSTORE_PASSWORD --key-pass env:JARVIS_KEY_PASSWORD \
            --out "$signed" "$unsigned"
          "$APKSIGNER" verify --verbose --print-certs "$signed"
          rm -f "$KEYSTORE"

      - name: Upload signed release APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release-apks
          path: release-assets/*.apk
          if-no-files-found: error
          retention-days: 3

  publish:
    if: inputs.confirm_publish == true
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release-apks
          path: release-assets

      - name: Publish reviewed release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" release-assets/*.apk \
            --title "Jarvis $RELEASE_TAG" --generate-notes
