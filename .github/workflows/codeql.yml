name: CodeQL

on:
  push:
    branches: [master, main, jarvis-development]
  pull_request:
    branches: [master, main, jarvis-development]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Gradle wrapper JAR checksum
        run: printf '%s  %s\n' '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046' 'gradle/wrapper/gradle-wrapper.jar' | sha256sum --check --strict
      - name: Set up Android SDK
        if: matrix.language == 'java-kotlin'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools

      - name: Install Android platform for Kotlin analysis
        if: matrix.language == 'java-kotlin'
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Build Android and JVM code
        if: matrix.language == 'java-kotlin'
        uses: github/codeql-action/autobuild@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@74c1aea9df7c0f02e9b7bfe4a8935abf2e5e3aa6 # v3
        with:
          category: "/language:${{ matrix.language }}"
